# Pull-request validation. Also called by deploy.yml so every deployment runs exactly these checks first.
name: CI
on:
  pull_request:
  push:
    branches-ignore: [main, staging] # deploy.yml validates these branches before deploying
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, gd, exif, bcmath, zip, pdo_mysql, pdo_sqlite, sqlite3

jobs:
  quality:
    name: Formatting, static analysis, TypeScript, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies (from composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies (from package-lock.json)
        run: npm ci --ignore-scripts

      - name: Pint (formatting)
        run: vendor/bin/pint --test

      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: TypeScript (strict)
        run: npx tsc --noEmit

      - name: Production asset build
        run: npm run build

      - name: ShellCheck deployment scripts
        run: shellcheck --severity=warning deploy/remote/*.sh deploy/provision/*.sh

  tests:
    name: PHPUnit (MySQL 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: htfarms_test
          MYSQL_USER: htfarms
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root-secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-secret"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:Y2ktb25seS10ZXN0LWtleS1ub3QtcHJvZHVjdGlvbiE= # test-only dummy key
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: htfarms_test
      DB_USERNAME: htfarms
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run test suite
        run: php artisan test --compact

  browser:
    name: Browser checks (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_URL: http://127.0.0.1:8123
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Prepare an isolated, seeded application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          {
            echo "APP_URL=${APP_URL}"
            echo "ENQUIRY_VERIFY_EMAIL_DNS=false"
            echo "ENQUIRY_MIN_FILL_SECONDS=2"
            echo "QUEUE_CONVERSIONS_BY_DEFAULT=false"
          } >> .env
          touch database/database.sqlite
          php artisan migrate --seed --force --no-interaction
          php artisan storage:link

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
