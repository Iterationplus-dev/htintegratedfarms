# /etc/nginx/sites-available/htfarms.conf  (symlink into sites-enabled)
# Replace htintegratedfarms.com with the real host names. TLS certificates come from certbot
# (see docs/DEPLOYMENT.md). For staging, copy this file and change server_name, root and socket.

limit_req_zone $binary_remote_addr zone=htfarms_livewire:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name htintegratedfarms.com www.htintegratedfarms.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://htintegratedfarms.com$request_uri; }
}

server {
    # `listen … http2` (not `http2 on;`) so the config works on nginx < 1.25.1, e.g. Ubuntu 24.04's 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.htintegratedfarms.com;

    ssl_certificate     /etc/letsencrypt/live/htintegratedfarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htintegratedfarms.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://htintegratedfarms.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name htintegratedfarms.com;

    # Document root is Laravel's public/ inside the CURRENT release.
    root /var/www/htfarms/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/htintegratedfarms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/htintegratedfarms.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20m; # admin image uploads (app limit 8–10 MB)

    access_log /var/log/nginx/htfarms.access.log;
    error_log  /var/log/nginx/htfarms.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Fingerprinted Vite build output: cache forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded media (Media Library conversions). File names change when images are replaced.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Throttle Livewire update requests (form submissions are also rate-limited in the app).
    location ^~ /livewire- {
        limit_req zone=htfarms_livewire burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/htfarms.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the `current` symlink so OPcache keys follow each release.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Never serve other PHP files, dotfiles or source.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
