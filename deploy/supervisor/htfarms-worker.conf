; /etc/supervisor/conf.d/htfarms-worker.conf
; Queue workers for notifications, back-in-stock alerts and image conversions.
; `php artisan queue:restart` (run on every deploy) makes workers exit after their current job;
; Supervisor restarts them from the new `current` release.
[program:htfarms-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.5 /var/www/htfarms/current/artisan queue:work redis --queue=default --sleep=3 --tries=3 --backoff=30 --max-time=3600 --memory=256
directory=/var/www/htfarms/current
user=www-data
umask=002
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/htfarms/shared/storage/logs/worker.log
stdout_logfile_maxbytes=0
