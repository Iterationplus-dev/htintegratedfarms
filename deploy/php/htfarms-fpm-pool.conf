; /etc/php/8.5/fpm/pool.d/htfarms.conf
; Dedicated pool for the site. Runs as www-data; code is owned by the deploy user (read-only to PHP),
; shared/storage is group-writable (setgid www-data).
[htfarms]
user = www-data
group = www-data
listen = /run/php/htfarms.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12        ; ~60 MB per worker; size to available RAM
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 65s
catch_workers_output = yes
decorate_workers_output = no

; Files created by PHP (logs, cache, uploads) stay group-writable for the deploy user.
php_admin_value[umask] = 0002
php_admin_value[error_log] = /var/log/php8.5-fpm-htfarms.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 16M
php_admin_value[memory_limit] = 256M
php_admin_value[expose_php] = off
php_admin_value[session.cookie_secure] = 1
